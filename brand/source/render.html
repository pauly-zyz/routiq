<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ROUTIQ brand renderer</title>
<style>
  @font-face { font-family: "SG"; src: url("../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "JBM"; src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  @font-face { font-family: "INT"; src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Deterministic renderer: draw(t) paints one frame for t in [0, 1). The animation loops seamlessly at t = 1.
const params = new URLSearchParams(location.search)
const MODE = params.get('mode') || 'banner'           // banner | logo | logo-anim
const W = Number(params.get('w') || (MODE === 'banner' ? 1500 : 1024))
const H = Number(params.get('h') || (MODE === 'banner' ? 500 : W))
const cv = document.getElementById('c')
cv.width = W; cv.height = H
const ctx = cv.getContext('2d')
const TAU = Math.PI * 2
const VIOLET = '#7C5CFF', BLUE = '#5E8BFF', CYAN = '#38D9F5'

// Small seeded RNG so every render is identical.
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 } }

function brandGradient(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1)
  g.addColorStop(0, VIOLET); g.addColorStop(0.55, BLUE); g.addColorStop(1, CYAN)
  return g
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath()
}

// The ROUTIQ mark on a 32-unit grid: rounded square, route path, two end nodes, faint second leg.
function drawMark(x, y, size, opts = {}) {
  const s = size / 32
  const MINT = '#97FCE4'
  ctx.save()
  ctx.translate(x, y)
  if (opts.glow) { ctx.shadowColor = 'rgba(151,252,228,.45)'; ctx.shadowBlur = size * 0.35 }
  roundRect(0, 0, size, size, 9 * s)
  const bg = ctx.createLinearGradient(0, 0, size, size)
  bg.addColorStop(0, '#0E2E28'); bg.addColorStop(0.55, '#081B16'); bg.addColorStop(1, '#041210')
  ctx.fillStyle = bg; ctx.fill()
  ctx.shadowBlur = 0
  const hl = ctx.createRadialGradient(size * 0.25, size * 0.2, 0, size * 0.25, size * 0.2, size * 0.8)
  hl.addColorStop(0, 'rgba(151,252,228,.28)'); hl.addColorStop(1, 'rgba(151,252,228,0)')
  roundRect(0, 0, size, size, 9 * s); ctx.fillStyle = hl; ctx.fill()
  roundRect(0.5, 0.5, size - 1, size - 1, 9 * s); ctx.strokeStyle = 'rgba(151,252,228,.35)'; ctx.lineWidth = Math.max(1, s * 0.6); ctx.stroke()

  // Elysium halo around the destination node
  ctx.save(); ctx.translate(23 * s, 10 * s); ctx.rotate(-0.42)
  ctx.strokeStyle = 'rgba(151,252,228,.32)'; ctx.lineWidth = 0.9 * s
  ctx.beginPath(); ctx.ellipse(0, 0, 6.4 * s, 2.5 * s, 0, 0, TAU); ctx.stroke(); ctx.restore()

  ctx.shadowColor = 'rgba(151,252,228,.6)'; ctx.shadowBlur = size * 0.08
  ctx.strokeStyle = MINT; ctx.lineCap = 'round'; ctx.lineWidth = 2.4 * s
  ctx.beginPath(); ctx.moveTo(9 * s, 22 * s); ctx.lineTo(9 * s, 14 * s); ctx.arcTo(9 * s, 10 * s, 13 * s, 10 * s, 4 * s); ctx.lineTo(23 * s, 10 * s); ctx.stroke()
  ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(15 * s, 22 * s); ctx.lineTo(23 * s, 22 * s); ctx.stroke(); ctx.globalAlpha = 1
  ctx.fillStyle = MINT
  ctx.beginPath(); ctx.arc(9 * s, 22 * s, 2.6 * s, 0, TAU); ctx.fill()
  ctx.beginPath(); ctx.arc(23 * s, 10 * s, 2.6 * s, 0, TAU); ctx.fill()
  ctx.shadowBlur = 0

  if (opts.packet !== undefined) {
    const p = pointOnRoute(opts.packet)
    const r = 5.5 * s
    const g = ctx.createRadialGradient(p[0] * s, p[1] * s, 0, p[0] * s, p[1] * s, r * 2.4)
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(190,255,240,.9)'); g.addColorStop(1, 'rgba(151,252,228,0)')
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p[0] * s, p[1] * s, r * 2.4, 0, TAU); ctx.fill()
  }
  ctx.restore()
}

// Route path in mark units: (9,22) up to (9,14), quarter arc to (13,10), right to (23,10).
function pointOnRoute(u) {
  const L1 = 8, L2 = Math.PI * 2, L3 = 10, L = L1 + L2 + L3
  let d = ((u % 1) + 1) % 1 * L
  if (d < L1) return [9, 22 - d]
  d -= L1
  if (d < L2) { const a = Math.PI + (d / L2) * (Math.PI / 2); return [13 + 4 * Math.cos(a), 14 + 4 * Math.sin(a)] }
  d -= L2
  return [13 + d, 10]
}

function background() {
  ctx.fillStyle = '#06060B'; ctx.fillRect(0, 0, W, H)
  const blob = (x, y, r, color) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r)
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(6,6,11,0)')
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  }
  blob(W * 0.12, H * 0.05, H * 1.15, 'rgba(124,92,255,.42)')
  blob(W * 0.92, H * 0.95, H * 1.05, 'rgba(56,217,245,.22)')
  blob(W * 0.62, H * 0.4, H * 0.7, 'rgba(94,139,255,.12)')
  // grid, fading toward the edges
  ctx.save()
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1
  const step = 50
  for (let x = 0.5; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke() }
  for (let y = 0.5; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke() }
  const fade = ctx.createRadialGradient(W * 0.5, H * 0.45, H * 0.2, W * 0.5, H * 0.45, W * 0.62)
  fade.addColorStop(0, 'rgba(6,6,11,0)'); fade.addColorStop(1, 'rgba(6,6,11,.92)')
  ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H)
  ctx.restore()
}

// Drifting node network; positions loop with t.
const R = rng(42)
const NODES = Array.from({ length: 46 }, () => ({ x: R(), y: R(), ax: 6 + R() * 14, ay: 4 + R() * 10, ph: R(), k: 1 + Math.floor(R() * 2) }))
function network(t, x0, x1, alpha) {
  const pts = NODES.map(n => [x0 + n.x * (x1 - x0) + n.ax * Math.sin(TAU * (t * n.k + n.ph)), 18 + n.y * (H - 36) + n.ay * Math.cos(TAU * (t * n.k + n.ph))])
  const LINK = 150
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1])
    if (d < LINK) { ctx.strokeStyle = `rgba(124,92,255,${(1 - d / LINK) * 0.28 * alpha})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[j]); ctx.stroke() }
  }
  ctx.fillStyle = `rgba(210,210,230,${0.55 * alpha})`
  for (const p of pts) { ctx.beginPath(); ctx.arc(p[0], p[1], 1.6, 0, TAU); ctx.fill() }
  return pts
}

function glowDot(x, y, r, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3)
  g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(0.3, `rgba(150,235,255,${0.85 * a})`); g.addColorStop(1, 'rgba(56,217,245,0)')
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill()
}

function pill(x, y, w, h, text, opts = {}) {
  ctx.save()
  roundRect(x, y, w, h, h / 2)
  ctx.fillStyle = opts.fill || 'rgba(18,18,30,.92)'; ctx.fill()
  ctx.lineWidth = opts.lineWidth || 1.2
  ctx.strokeStyle = opts.stroke || 'rgba(255,255,255,.16)'; ctx.stroke()
  ctx.fillStyle = opts.color || '#E8E8F2'
  ctx.font = opts.font || '500 17px JBM'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText(text, x + w / 2 + (opts.dx || 0), y + h / 2 + 1)
  ctx.restore()
}

function bezierPoint(p0, p1, p2, p3, u) {
  const m = 1 - u
  return [
    m * m * m * p0[0] + 3 * m * m * u * p1[0] + 3 * m * u * u * p2[0] + u * u * u * p3[0],
    m * m * m * p0[1] + 3 * m * m * u * p1[1] + 3 * m * u * u * p2[1] + u * u * u * p3[1]
  ]
}

function drawBanner(t) {
  background()
  network(t, W * 0.48, W * 1.02, 0.9)

  // ---------- left: brand ----------
  const lx = 104
  drawMark(lx, 112, 112, { glow: true, packet: t })
  ctx.fillStyle = '#FFFFFF'
  ctx.font = '700 118px SG'
  ctx.textBaseline = 'alphabetic'
  ctx.letterSpacing = '-2px'
  ctx.fillText('ROUTIQ', lx + 140, 207)
  ctx.letterSpacing = '0px'

  // tagline with a moving sheen
  ctx.font = '600 40px SG'
  const tag = 'Every on-chain tool your agent needs.'
  const tw = ctx.measureText(tag).width
  const shift = (t * 2 % 1) * (tw + 600) - 300
  const g = ctx.createLinearGradient(lx + shift - 300, 0, lx + shift + 300, 0)
  g.addColorStop(0, '#9B85FF'); g.addColorStop(0.5, '#E6FBFF'); g.addColorStop(1, CYAN)
  const base = brandGradient(lx, 0, lx + tw, 0)
  ctx.fillStyle = base; ctx.fillText(tag, lx, 300)
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = g
  ctx.beginPath(); ctx.rect(lx + shift - 300, 240, 600, 80); ctx.clip()
  const sg = ctx.createLinearGradient(lx + shift - 300, 0, lx + shift + 300, 0)
  sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,.75)'); sg.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = sg; ctx.fillText(tag, lx, 300)
  ctx.restore()

  // chips row
  const chips = [
    { t: 'MCP SERVER', dot: true },
    { t: 'LAUNCHING ON ELYSIUM' },
    { t: '12 MCP TOOLS' }
  ]
  let cx = lx
  ctx.font = '500 16px JBM'
  for (const c of chips) {
    const w = ctx.measureText(c.t).width + (c.dot ? 58 : 40)
    pill(cx, 344, w, 40, c.t, { font: '500 16px JBM', color: '#C9C9D6', fill: 'rgba(255,255,255,.04)', dx: c.dot ? 9 : 0 })
    if (c.dot) {
      const pulse = 0.5 + 0.5 * Math.sin(TAU * t * 2)
      ctx.fillStyle = `rgba(52,211,153,${0.18 + 0.25 * pulse})`; ctx.beginPath(); ctx.arc(cx + 22, 364, 6 + 5 * pulse, 0, TAU); ctx.fill()
      ctx.fillStyle = '#34D399'; ctx.beginPath(); ctx.arc(cx + 22, 364, 5, 0, TAU); ctx.fill()
    }
    cx += w + 12
  }

  // ---------- right: routing diagram ----------
  const hub = [1080, 250]
  const agent = [870, 250]
  const tools = [
    { name: 'token_verify', y: 92 },
    { name: 'wallet_portfolio', y: 197 },
    { name: 'chain_status', y: 303 },
    { name: 'market_hours', y: 408 }
  ]
  const tx = 1250
  // agent -> hub line
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(agent[0] + 62, agent[1]); ctx.lineTo(hub[0] - 60, hub[1]); ctx.stroke()
  // fan curves
  const curves = tools.map(tl => [[hub[0] + 58, hub[1]], [hub[0] + 130, hub[1]], [tx - 110, tl.y + 22], [tx - 20, tl.y + 22]])
  for (const c of curves) {
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2
    ctx.beginPath(); ctx.moveTo(...c[0]); ctx.bezierCurveTo(...c[1], ...c[2], ...c[3]); ctx.stroke()
    const lg = ctx.createLinearGradient(c[0][0], 0, c[3][0], 0)
    lg.addColorStop(0, 'rgba(124,92,255,.65)'); lg.addColorStop(1, 'rgba(56,217,245,.65)')
    ctx.strokeStyle = lg; ctx.lineWidth = 2; ctx.setLineDash([6, 10]); ctx.lineDashOffset = -t * 64
    ctx.beginPath(); ctx.moveTo(...c[0]); ctx.bezierCurveTo(...c[1], ...c[2], ...c[3]); ctx.stroke()
    ctx.setLineDash([])
  }
  // packets: agent -> hub, then out to each tool
  for (let k = 0; k < 2; k++) {
    const u = (t * 2 + k * 0.5) % 1
    glowDot(agent[0] + 62 + (hub[0] - 60 - agent[0] - 62) * u, hub[1], 4.5)
  }
  curves.forEach((c, i) => {
    for (let k = 0; k < 2; k++) {
      const u = (t + i * 0.25 + k * 0.5) % 1
      glowDot(...bezierPoint(...c, u), 4.2, Math.sin(Math.PI * u) * 0.9 + 0.1)
    }
  })
  // agent pill
  pill(agent[0] - 62, agent[1] - 22, 124, 44, 'agent', { font: '500 18px JBM', color: '#C9C9D6' })
  // hub
  ctx.save(); ctx.shadowColor = 'rgba(124,92,255,.7)'; ctx.shadowBlur = 40
  roundRect(hub[0] - 60, hub[1] - 60, 120, 120, 30); ctx.fillStyle = '#12101F'; ctx.fill(); ctx.restore()
  roundRect(hub[0] - 60, hub[1] - 60, 120, 120, 30); ctx.lineWidth = 2; ctx.strokeStyle = brandGradient(hub[0] - 60, hub[1] - 60, hub[0] + 60, hub[1] + 60); ctx.stroke()
  drawMark(hub[0] - 38, hub[1] - 38, 76)
  // tool pills
  tools.forEach((tl, i) => {
    const active = Math.floor(t * 4) === i
    pill(tx - 20, tl.y, 220, 44, tl.name, {
      font: '500 16px JBM',
      color: active ? '#FFFFFF' : '#C9C9D6',
      stroke: active ? 'rgba(56,217,245,.75)' : 'rgba(255,255,255,.16)',
      fill: active ? 'rgba(56,217,245,.10)' : 'rgba(18,18,30,.92)',
      lineWidth: active ? 1.6 : 1.2
    })
  })
}

// Logo themes: "dark" (default — HYPE mint on deep teal for the Elysium launch), "hype" (light mint), "classic" (violet→cyan).
const THEME = params.get('theme') || 'dark'
const LOGO_THEMES = {
  classic: { bg: ['#6A45FF', '#4F7DFF', '#2FCFEF'], light: 'rgba(255,255,255,.28)', shade: 'rgba(10,8,40,.18)', glyph: '#FFFFFF', glyphShadow: 'rgba(20,10,80,.35)', packet: ['rgba(255,255,255,1)', 'rgba(200,250,255,.9)', 'rgba(56,217,245,0)'], ring: 'rgba(255,255,255,', halo: null },
  hype: { bg: ['#BFFFEC', '#5FE3C8', '#1C9E95'], light: 'rgba(255,255,255,.38)', shade: 'rgba(0,45,40,.22)', glyph: '#05231F', glyphShadow: 'rgba(0,70,60,.28)', packet: ['rgba(255,255,255,1)', 'rgba(220,255,247,.95)', 'rgba(151,252,228,0)'], ring: 'rgba(5,35,31,', halo: 'rgba(5,35,31,.16)' },
  dark: { bg: ['#0A231F', '#07170F', '#041210'], light: 'rgba(151,252,228,.30)', shade: 'rgba(0,0,0,.35)', glyph: '#97FCE4', glyphShadow: 'rgba(151,252,228,.65)', packet: ['rgba(255,255,255,1)', 'rgba(190,255,240,.95)', 'rgba(151,252,228,0)'], ring: 'rgba(151,252,228,', halo: 'rgba(151,252,228,.30)' }
}

function drawLogo(t, animated) {
  const th = LOGO_THEMES[THEME] || LOGO_THEMES.hype
  // Full-bleed square that still reads well when cropped to a circle.
  const g = ctx.createLinearGradient(0, 0, W, H)
  g.addColorStop(0, th.bg[0]); g.addColorStop(0.5, th.bg[1]); g.addColorStop(1, th.bg[2])
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  const l = ctx.createRadialGradient(W * 0.25, H * 0.18, 0, W * 0.25, H * 0.18, W * 0.8)
  l.addColorStop(0, th.light); l.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = l; ctx.fillRect(0, 0, W, H)
  const d = ctx.createRadialGradient(W * 0.85, H * 0.95, 0, W * 0.85, H * 0.95, W * 0.9)
  d.addColorStop(0, th.shade); d.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = d; ctx.fillRect(0, 0, W, H)

  const s = W / 32 * 0.78
  const ox = W / 2 - 16 * s, oy = H / 2 - 16 * s
  ctx.save(); ctx.translate(ox, oy)

  // Elysium halo: a tilted orbit around the destination node — the route "arrives" at the launch chain.
  if (th.halo) {
    ctx.save()
    ctx.translate(23 * s, 10 * s); ctx.rotate(-0.42)
    ctx.strokeStyle = th.halo; ctx.lineWidth = 0.9 * s
    ctx.beginPath(); ctx.ellipse(0, 0, 6.4 * s, 2.5 * s, 0, 0, TAU); ctx.stroke()
    ctx.restore()
  }

  ctx.shadowColor = th.glyphShadow; ctx.shadowBlur = W * (THEME === 'dark' ? 0.06 : 0.04); ctx.shadowOffsetY = THEME === 'dark' ? 0 : W * 0.012
  ctx.strokeStyle = th.glyph; ctx.lineCap = 'round'; ctx.lineWidth = 2.6 * s
  ctx.beginPath(); ctx.moveTo(9 * s, 22 * s); ctx.lineTo(9 * s, 14 * s); ctx.arcTo(9 * s, 10 * s, 13 * s, 10 * s, 4 * s); ctx.lineTo(23 * s, 10 * s); ctx.stroke()
  ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(15 * s, 22 * s); ctx.lineTo(23 * s, 22 * s); ctx.stroke(); ctx.globalAlpha = 1
  ctx.fillStyle = th.glyph
  const pulse = animated ? 0.5 + 0.5 * Math.sin(TAU * t) : 0
  ctx.beginPath(); ctx.arc(9 * s, 22 * s, 2.9 * s, 0, TAU); ctx.fill()
  ctx.beginPath(); ctx.arc(23 * s, 10 * s, (2.9 + 0.5 * pulse) * s, 0, TAU); ctx.fill()
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0
  if (animated) {
    const p = pointOnRoute(t)
    const r = 3.2 * s
    const gg = ctx.createRadialGradient(p[0] * s, p[1] * s, 0, p[0] * s, p[1] * s, r * 2.2)
    gg.addColorStop(0, th.packet[0]); gg.addColorStop(0.4, th.packet[1]); gg.addColorStop(1, th.packet[2])
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p[0] * s, p[1] * s, r * 2.2, 0, TAU); ctx.fill()
    ctx.strokeStyle = `${th.ring}${0.6 * (1 - pulse)})`; ctx.lineWidth = 0.6 * s
    ctx.beginPath(); ctx.arc(23 * s, 10 * s, (3.2 + 4 * pulse) * s, 0, TAU); ctx.stroke()
  }
  ctx.restore()
}

window.draw = (t) => {
  ctx.clearRect(0, 0, W, H)
  if (MODE === 'banner') drawBanner(t)
  else drawLogo(t, MODE === 'logo-anim')
}
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load('700 100px SG'), document.fonts.load('600 40px SG'), document.fonts.load('500 16px JBM')
])).then(() => { window.draw(0); return true })
</script>
</body>
</html>
